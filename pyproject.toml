[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verifind-ai"
version = "0.1.0"
description = "VERIFIND AI — lost & found dual multimodal matching with Zero-Fraud Shield"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "loguru>=0.7.0",
    "openai>=1.40.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "supabase>=2.7.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
    "arq>=0.26.0",
    "redis>=5.0.0",
    "langfuse>=2.0.0",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
