name: Release Builds

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "mobile/.fvmrc"
      - "mobile/analysis_options.yaml"
      - "mobile/android/**"
      - "mobile/ios/**"
      - "mobile/lib/**"
      - "mobile/pubspec.lock"
      - "mobile/pubspec.yaml"
      - "mobile/test/**"
      - ".github/workflows/release.yml"
  pull_request:
    branches: [main, master, dev]
    paths:
      - "mobile/.fvmrc"
      - "mobile/analysis_options.yaml"
      - "mobile/android/**"
      - "mobile/ios/**"
      - "mobile/lib/**"
      - "mobile/pubspec.lock"
      - "mobile/pubspec.yaml"
      - "mobile/test/**"
      - ".github/workflows/release.yml"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: "3.38.5"

jobs:
  android:
    name: Android check + release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Unit / widget tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Upload Android artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS release build (no codesign)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS release
        run: flutter build ios --release --no-codesign

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-build
          path: mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14
