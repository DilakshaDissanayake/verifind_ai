name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  backend:
    name: pytest (core paths)
    runs-on: ubuntu-latest
    env:
      AUTH_DEV_BYPASS: "true"
      AUTH_DEV_ROLE: admin
      ARQ_WORKER_ENABLED: "false"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync
      - name: Run tests
        run: uv run pytest tests/ -q --tb=line

  admin-ui:
    name: admin UI typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run lint
