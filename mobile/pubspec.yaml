name: verifind_mobile
description: VERIFIND Flutter client - Sprint 5 Verify + Chat
publish_to: "none"
version: 0.5.0+sprint5

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  dio: ^5.7.0
  http_parser: ^4.0.2
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  web_socket_channel: ^3.0.1
  phosphoricons_flutter: ^1.0.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
  # Launcher source art lives in assets/images/app_image/ (see flutter_launcher_icons.yaml).
  # Do not list that folder here — it is build-time only.